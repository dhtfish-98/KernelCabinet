name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  defensive-extraction:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make
      - run: python3 checks/kernelcabinet_safety.py
      - run: make install DESTDIR="$RUNNER_TEMP/consumer" PREFIX=/usr/local
